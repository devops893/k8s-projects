apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-utilities
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devops893/k8s-projects.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
